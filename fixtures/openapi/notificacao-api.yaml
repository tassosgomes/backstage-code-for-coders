# Exemplo local de contrato OpenAPI para desenvolvimento sem GitHub.
# Fonte de verdade: repo de contratos (https://github.com/tassosgomes/code-for-coders).
openapi: 3.1.0

info:
  title: Notificação — API de pedidos de envio
  description: |
    API para solicitar e consultar envios de notificação transacional por e-mail.

    **Contrato gerado a partir do PRD:** `tasks/prd-notificacao-transacional/prd.md`
  version: '1.0.0'
  contact:
    name: platform
  x-owner: group:default/platform
  x-lifecycle: production

servers:
  - url: http://localhost:3000/api/v1
    description: Desenvolvimento local
  - url: https://api.code-for-coders.dev/api/v1
    description: Produção

security:
  - BearerAuth: []

tags:
  - name: Envios
    description: Operações de pedido e acompanhamento de envios

paths:
  /envios:
    post:
      summary: Solicitar envio de notificação
      description: |
        Cria um pedido de envio. Notificação é carteira: valida apenas a
        validade do pedido (RN-N01, RN-N02), nunca o mérito.
      operationId: solicitarEnvio
      tags: [Envios]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeEnvio'
      responses:
        '202':
          description: Pedido aceito para processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '422':
          description: Pedido inválido (regras RN-N01/RN-N02)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Credenciais ausentes ou inválidas
  /envios/{id}:
    get:
      summary: Consultar envio por identificador
      operationId: obterEnvio
      tags: [Envios]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Envio encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envio'
        '404':
          description: Envio não encontrado

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PedidoDeEnvio:
      type: object
      required: [tipo, destinatario, payload]
      properties:
        tipo:
          type: string
          enum: [confirmacao-de-conta, recuperacao-de-senha]
          description: Modelo de mensagem a ser enviado.
        destinatario:
          type: string
          format: email
          description: Endereço de e-mail de destino.
        payload:
          type: object
          description: Variáveis do modelo de mensagem.
    Envio:
      type: object
      required: [id, tipo, status, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
        status:
          type: string
          enum: [solicitado, entregue, falhou]
        criadoEm:
          type: string
          format: date-time
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo:
          type: string
        mensagem:
          type: string
